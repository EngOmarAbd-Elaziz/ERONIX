plugins {
    id "com.android.application"
}

def releaseStorePath = System.getenv("ANDROID_KEYSTORE_PATH")

android {
    namespace "hospital.android"
    compileSdk 35

    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        applicationId "hospital.eronix"
        minSdk 34
        targetSdk 34
        versionCode = (System.getenv("ERONIX_VERSION_CODE") ?: "1").toInteger()
        versionName = (System.getenv("ERONIX_VERSION_NAME") ?: "1.0.0")
    }

    signingConfigs {
        if (releaseStorePath) {
            release {
                storeFile file(releaseStorePath)
                storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                keyAlias System.getenv("ANDROID_KEY_ALIAS")
                keyPassword System.getenv("ANDROID_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            if (releaseStorePath) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main.java.srcDirs += [
                "../../src/main/java/hospital/simulation",
                "../../src/main/java/hospital/update"
        ]
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }
}

tasks.configureEach { task ->
    if (task.name == "assembleRelease") {
        task.doFirst {
            if (!releaseStorePath) {
                throw new GradleException(
                        "Set the Android signing secrets before building a release APK.")
            }
        }
    }
}

dependencies {
    testImplementation "junit:junit:4.13.2"
}
