name: Build ERONIX releases

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package-linux:
    name: Package Linux application
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Install Debian packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y fakeroot
      - name: Set release version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+(\.[0-9]+)*$ ]]; then
            VERSION="1.0.${GITHUB_RUN_NUMBER}"
          fi
          echo "ERONIX_VERSION=$VERSION" >> "$GITHUB_ENV"
      - name: Build Linux installer
        env:
          ERONIX_PACKAGE_TYPE: deb
        run: bash scripts/package-linux.sh
      - name: Stage Linux installer
        run: cp dist/linux/packages/*.deb "$RUNNER_TEMP/ERONIX-linux.deb"
      - uses: actions/upload-artifact@v4
        with:
          name: ERONIX-linux
          path: ${{ runner.temp }}/ERONIX-linux.deb
          if-no-files-found: error

  package-windows:
    name: Package Windows application
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Set release version
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          if ($version -notmatch '^\d+(\.\d+)*$') {
            $version = "1.0.$env:GITHUB_RUN_NUMBER"
          }
          "ERONIX_VERSION=$version" >> $env:GITHUB_ENV
      - name: Build Windows installer
        shell: pwsh
        run: ./scripts/package-windows.ps1
      - name: Stage Windows installer
        shell: pwsh
        run: Copy-Item dist/windows/installers/*.msi "$env:RUNNER_TEMP/ERONIX-windows.msi"
      - uses: actions/upload-artifact@v4
        with:
          name: ERONIX-windows
          path: ${{ runner.temp }}/ERONIX-windows.msi
          if-no-files-found: error

  package-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Check Android signing configuration
        id: signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$ANDROID_KEYSTORE_PASSWORD" ] \
              && [ -n "$ANDROID_KEY_ALIAS" ] && [ -n "$ANDROID_KEY_PASSWORD" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Android APK skipped; configure all four Android signing secrets to publish it."
          fi
      - name: Decode Android release keystore
        if: steps.signing.outputs.ready == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/eronix-release.jks"
      - name: Set Android release version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+(\.[0-9]+)*$ ]]; then
            VERSION="1.0.${GITHUB_RUN_NUMBER}"
          fi
          echo "ERONIX_VERSION_NAME=$VERSION" >> "$GITHUB_ENV"
      - name: Test and build signed APK
        if: steps.signing.outputs.ready == 'true'
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/eronix-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ERONIX_VERSION_CODE: ${{ github.run_number }}
        run: ./gradlew testDebugUnitTest assembleRelease
      - name: Stage signed Android APK
        if: steps.signing.outputs.ready == 'true'
        run: cp android/app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/ERONIX-android.apk"
      - uses: actions/upload-artifact@v4
        if: steps.signing.outputs.ready == 'true'
        with:
          name: ERONIX-android
          path: ${{ runner.temp }}/ERONIX-android.apk
          if-no-files-found: error

  publish-release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/')
    needs:
      - package-linux
      - package-windows
      - package-android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: ERONIX-*
          path: release-assets
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          name: ERONIX ${{ github.ref_name }}
          generate_release_notes: true
          files: release-assets/*
          fail_on_unmatched_files: true
